name: 4th workflow
on: 
  workflow_run: 
    workflows: [3rd workflow]
    types:
      - completed
jobs:
  success_job:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: success
        run: echo "success"
  failure-job:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure'}}
    steps:
      - name: fail
        run: echo " failure"
  